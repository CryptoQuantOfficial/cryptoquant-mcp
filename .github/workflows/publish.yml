name: Publish MCP Server to npm

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    # id-token: write lets npm publish via Trusted Publishing (OIDC); no NPM_TOKEN needed.
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Use npm 11 (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@^11.5.1 && npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Check version against release
        env:
          TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "::error::Release tag $TAG does not match package.json version v$VERSION"; exit 1
          fi
          case "$VERSION" in
            *-*) [ "$PRERELEASE" = "true" ] || { echo "::error::$VERSION is a pre-release version; mark the GitHub release as a pre-release"; exit 1; } ;;
            *)   [ "$PRERELEASE" != "true" ] || { echo "::error::$VERSION is not a pre-release version but the GitHub release is marked pre-release"; exit 1; } ;;
          esac

      - name: Publish pre-release to npm (beta tag)
        if: ${{ github.event.release.prerelease }}
        run: npm publish --access public --provenance --tag beta

      - name: Publish to npm (latest)
        if: ${{ !github.event.release.prerelease }}
        run: npm publish --access public --provenance
